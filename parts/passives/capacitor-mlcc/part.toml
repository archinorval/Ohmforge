# Generic multilayer ceramic capacitor; capacitance per placement.
# ESR/ESL are typical small-case values; DC-bias derating is not modelled.
[part]
id = "generic.capacitor-mlcc"
name = "Ceramic chip capacitor (X5R/X7R)"
category = "passive/capacitor"
model = "rust:capacitor"
verification = "community"

[[pin]]
number = "1"
name = "1"
kind = "passive"
[[pin]]
number = "2"
name = "2"
kind = "passive"

[electrical]
rated_voltage = { typ = 25.0, unit = "V" }

