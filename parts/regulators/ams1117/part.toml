# AMS1117 1 A LDO. Analog model: ams1117.lib (Ohmforge macromodel, checked
# against the datasheet's typical values and against ngspice).
[part]
id = "ams.ams1117-3.3"
name = "AMS1117-3.3 1 A low-dropout regulator"
category = "power/regulator/linear"
datasheet = "http://www.advanced-monolithic.com/pdf/ds1117.pdf"
model = "spice:ams1117.lib"
verification = "datasheet"

[[pin]]
number = "1"
name = "GND"
kind = "power"
[[pin]]
number = "2"
name = "VOUT"
kind = "power"
[[pin]]
number = "3"
name = "VIN"
kind = "power"

[electrical]
vout = { min = 3.267, typ = 3.3, max = 3.333, unit = "V", note = "25 C; 3.201..3.399 over load, line and temperature" }
dropout = { typ = 1.1, max = 1.3, unit = "V", note = "at 0.8 A" }
current_limit = { min = 0.9, typ = 1.1, max = 1.5, unit = "A", note = "Vin - Vout = 1.5 V" }
quiescent_current = { typ = 5e-3, max = 11e-3, unit = "A" }
line_regulation = { typ = 0.5e-3, max = 10e-3, unit = "V", note = "1.5 V <= Vin - Vout <= 12 V" }
load_regulation = { typ = 3e-3, max = 15e-3, unit = "V", note = "0 to 0.8 A" }
ripple_rejection = { min = 60.0, typ = 72.0, unit = "dB", note = "120 Hz, 22 uF tantalum" }
vin_max = { max = 15.0, unit = "V" }
theta_jc = { typ = 15.0, unit = "K/W" }

[analog]
kind = "subckt"
pins = ["VIN", "VOUT", "GND"]
file = "ams1117.lib"
subckt = "ams1117"
note = "Junction temperature: v(x<refdes>.tj) + tamb. Thermal resistance and capacitance are board-dependent estimates."
params = { vout = 3.3, rja = { typ = 90.0, unit = "K/W", note = "SOT-223 on a small copper area (estimate)" } }

[[variant]]
label = "SOT-223"
mpn = "AMS1117-3.3"
manufacturer = "Advanced Monolithic Systems"
footprint = "Package_TO_SOT_SMD:SOT-223-3_TabPin2"
offers = [{ supplier = "lcsc", sku = "C6186" }]

